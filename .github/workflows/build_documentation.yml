name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@f5ef8c4410ac8bee7c946b00adadb2380fc2de8b  # main
    with:
      commit_sha: ${{ github.sha }}
      package: openenv
      repo_owner: openenv
      version_tag_suffix: ""
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
